# A-Mem configuration with Gemini selected for final answer generation.

method_name: "amem"
method_type: "agentic_memory"
description: "A-Mem with Gemini Enterprise Agent Platform final-answer generation"

model:
  provider: "gemini"
  name: "gemini-2.5-flash"
  temperature: 0.3
  max_completion_tokens: 10000

agent_params:
  retrieve_num: 5
  # Use the same service-account-backed Vertex Gemini client for A-Mem's
  # metadata/evolution requests and final answers.
  amem_backend: "gemini"
  amem_model: "gemini-2.5-flash"
  amem_embedding_model: "BAAI/bge-small-zh-v1.5"
  amem_evo_threshold: 100
  amem_max_tokens: 10000
  amem_max_context_tokens: 200000
  amem_chunk_size_tokens: 5120
