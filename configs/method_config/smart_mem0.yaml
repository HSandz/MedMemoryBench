method_name: "smart_mem0"
method_type: "agentic_memory"
description: "SmartMem0: Grounded Answer-or-Search Long-Term Memory"

model:
  provider: "openai"
  name: "gemini-3.5-flash-lite"
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  temperature: 0.3
  max_completion_tokens: 8192

agent_params:
  subject_aliases: {}  # Only caller-supplied owner aliases; no built-in ontology.

  # Bounded, architecture-level retrieval limits. They are not benchmark routes.
  retrieve_num: 8
  max_context_tokens: 32768

  # Memorize phase ---------------------------------------------------------
  enable_memory_write: true
  frozen_memory_path: null
  memory_snapshot_revision: 16
  write_window_max_turns: 64
  write_window_max_tokens: 8000
  write_context_mode: none
  write_prior_belief_limit: 8
  write_provisional_limit: 4
  max_new_memories: 12

  # READ architecture ------------------------------------------------------
  # LLM #1 sees the original question and question-owned BaseWorld evidence.
  # It either returns a grounded final ANSWER with exact support receipts or
  # returns up to four SEARCH probes for missing evidence.
  #
  # Runtime code owns:
  # - raw lexical/dense/literal recall
  # - retrieval execution and CandidateWorld <= 16
  # - BaseWorld retention
  # - provenance and hard caller metadata checks
  # - stored relation validity
  # - one structural zero-hit recovery
  # - the two-call budget
  #
  # Code does not attempt semantic entailment. Lexical/embedding similarity is
  # retrieval-only, never proof. A failed grounding receipt simply falls back
  # to LLM #2 over acquired evidence.
  enable_zero_result_recovery: true

embedding:
  provider: "local"
  model: "sentence-transformers/all-MiniLM-L6-v2"
