method_name: event_state
method_type: agentic_memory
description: Event-State Hybrid conversational memory with evidence-preserving state compilation
model:
  provider: openai
  name: gpt-5.1
  temperature: 0.0
  max_completion_tokens: 2000
memorize_model:
  provider: openai
  name: gpt-5.1
  temperature: 0.0
  max_completion_tokens: 1800
embedding:
  provider: openai
  model: text-embedding-3-small
build_config:
  enable_episodes: true
  enable_state_claims: true
  enable_state_compilation: true
  extraction_max_tokens: 1800
  max_claims_per_episode: 20
  state_candidate_top_k: 5
  state_candidate_min_similarity: 0.45
  update_min_confidence: 0.55
  store_raw_episode_text: true
  enable_bitemporal_time: true
  preserve_turn_evidence: true
retrieval_config:
  max_context_tokens: 120000
  retrieve_claims: true
  retrieve_episodes: true
  claim_top_k: 30
  episode_top_k: 20
  candidate_count: 40
  rrf_k: 60.0
  claim_retrieval_weight: 1.0
  episode_retrieval_weight: 1.0
  ppr_enabled: false
  selector_mode: state_mmr
  evidence_count: 8
  mmr_lambda: 0.7
