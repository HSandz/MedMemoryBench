# MIRIX Agent Configuration with Gemini selected as the model.

method_name: "mirix"
method_type: "agentic_memory"
description: "MIRIX with Gemini model configuration"

model:
  provider: "gemini"
  name: "gemini-2.5-flash"
  temperature: 0.3
  max_completion_tokens: 10000

agent_params:
  retrieve_num: 2
  memorize_chunk_tokens: 10240
  memorize_chunk_overlap_tokens: 200
  query_memory_item_tokens: 4096
  query_memory_context_tokens: 10240
  max_input_tokens: 20000
  max_context_tokens: 120000
  max_question_tokens: 4096
  use_native_query: false
  embedding_device: null

embedding:
  provider: "local"
  model: "bge-small-zh-v1.5"
  model_path: "BAAI/bge-small-zh-v1.5"
  dim: 512

# Run this method against persona 1 only; all sessions remain available.
dataset_overrides:
  persona_ids: [1]
  max_sessions_per_persona: null
