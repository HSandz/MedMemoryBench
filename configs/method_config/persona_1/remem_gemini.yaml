method_name: remem
method_type: agentic_memory
description: ReMem using hybrid Gemini provider
model:
  provider: gemini
  name: gemini-2.5-flash
  temperature: 0.0
  max_completion_tokens: 20000
embedding:
  provider: local
  model: BAAI/bge-small-zh-v1.5
  model_path: BAAI/bge-small-zh-v1.5
  dim: 512
build_config:
  extract_method: episodic_gist
  is_directed_graph: false
  synonymy_edge_sim_threshold: 0.8
  synonymy_edge_topk: 10
  retrieval_top_k: 5
  qa_top_k: 5
  linking_top_k: 5
  damping: 0.5
  passage_node_weight: 0.05
  use_agent: false
  agent_fixed_tools: false
  agent_max_steps: 5
  extraction_max_workers: 4
  use_cache: true
  force_index_from_scratch: false
  save_openie: true
  text_preprocessor_class_name: TextPreprocessor
  chunk_size_tokens: 10240
  chunk_overlap_tokens: 200
  embedding_batch_size: 16
  embedding_max_seq_len: 512
  max_input_tokens: 20000
  max_context_tokens: 120000
retrieval_config: {}
dataset_overrides:
  persona_ids:
  - 1
  max_sessions_per_persona: null
