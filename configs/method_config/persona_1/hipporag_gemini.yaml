# HippoRAG 2 configuration using Gemini Enterprise Agent Platform.

method_name: "hipporag"
method_type: "graph_rag"
description: "HippoRAG 2 using Gemini Enterprise Agent Platform"

model:
  provider: "gemini"
  name: "gemini-2.5-flash"
  temperature: 0.3
  max_completion_tokens: 10000

embedding:
  provider: "local"
  model: "BAAI/bge-small-zh-v1.5"
  model_path: "BAAI/bge-small-zh-v1.5"
  dim: 512

agent_params:
  openie_mode: "online"
  is_directed_graph: false
  synonymy_edge_sim_threshold: 0.8
  synonymy_edge_topk: 2047
  linking_top_k: 5
  retrieval_top_k: 200
  qa_top_k: 5
  damping: 0.5
  passage_node_weight: 0.05
  force_index_from_scratch: false
  force_openie_from_scratch: false
  save_openie: true
  chunk_size_tokens: 10240
  chunk_overlap_tokens: 200
  embedding_batch_size: 16
  embedding_max_seq_len: 512
  max_input_tokens: 20000
  max_context_tokens: 120000

# Run this method against persona 1 only; all sessions remain available.
dataset_overrides:
  persona_ids: [1]
  max_sessions_per_persona: null
