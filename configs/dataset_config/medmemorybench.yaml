dataset_name: "medmemorybench"
language: "en"  # zh / en

data:
  root_dir: "data/MedMemoryBench_EN"
  personas_file: null          # default
  sessions_pattern: "persona_{id}/eval/generated_dialogues.json"
  queries_pattern: "persona_{id}/eval/generated_queries.json"
  noise_file: "persona_{id}/eval/generated_dialogues_with_noise.json"

evaluation:
  mode: "independent"  # independent / merged
  persona_ids: [1]
  max_personas: null  
  max_sessions_per_persona: 50 

  evaluation_interval: 10 

  inject_noise: false

query_types:
  - name: "entity_exact_match"
    abbr: "EEM"
    metric: "string_contain"
    description: "Entity exact match"

  - name: "temporal_localization"
    abbr: "TLA"
    metric: "llm_judge"
    description: "Temporal localization"

  - name: "state_update"
    abbr: "SUA"
    metric: "llm_judge"
    description: "State update"

  - name: "multiple_choice"
    abbr: "MQ"
    metric: "option_match"
    description: "Multiple choice"

  - name: "inference_generation"
    abbr: "IG"
    metric: "llm_judge"
    description: "Inference generation"

  - name: "multi_hop_clinical_deduction"
    abbr: "MCD"
    metric: "llm_judge_mcd"
    description: "Multi-hop clinical deduction"

output:
  save_intermediate: true   
  save_retrieved_context: true 
