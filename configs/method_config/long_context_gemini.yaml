# Long-context baseline using Gemini Enterprise Agent Platform (formerly Vertex AI).
method_name: "long_context"
method_type: "baseline"
description: "Long Context Agent using Gemini through Google Agent Platform"

model:
  provider: "gemini"
  name: "gemini-2.5-flash"
  temperature: 0.3
  max_completion_tokens: 8192

agent_params:
  max_context_tokens: 100000
  truncation_strategy: "oldest_first"
