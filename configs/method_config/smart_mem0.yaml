method_name: "smart_mem0"
method_type: "agentic_memory"
description: "SmartMem0: Stable Semantic Evidence-Grounded Long-Term Memory"

model:
  provider: "openai"
  name: "gemini-3.5-flash-lite"
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  temperature: 0.3
  max_completion_tokens: 8192

agent_params:
  subject_aliases:
    patient: "primary_user"

  # Bounded, architecture-level retrieval limits. They are not benchmark routes.
  retrieve_num: 8
  max_context_tokens: 32768

  # Memorize phase ---------------------------------------------------------
  enable_memory_write: true
  frozen_memory_path: null
  memory_snapshot_revision: 16
  write_window_max_turns: 64
  write_window_max_tokens: 8000
  write_context_mode: none
  write_prior_belief_limit: 8
  write_provisional_limit: 4
  max_new_memories: 12

  # READ architecture ------------------------------------------------------
  # LLM #1 is a question-only semantic parser. It receives no retrieved memory.
  # It may emit only projection, minimal participant-memory requirements,
  # optional selectors, and genuine semantic relations.
  #
  # Runtime code owns:
  # - raw BM25/dense recall
  # - durable-address resolution
  # - selector execution
  # - fusion / candidate budgets
  # - structural coverage and bounded zero-hit recovery
  # - one-shot, post-retrieval, non-destructive proof
  # - context retention and terminal certification
  #
  # Proof is an architecture invariant rather than a tuning switch: it cannot
  # trigger acquisition, downgrade structural FOUND/EMPTY, or prune CandidateWorld.
  #
  # The only optional second retrieval pass is deterministic structural recovery,
  # and it is eligible only when a required evidence lane has zero viable support.
  enable_zero_result_recovery: true

embedding:
  provider: "local"
  model: "sentence-transformers/all-MiniLM-L6-v2"
