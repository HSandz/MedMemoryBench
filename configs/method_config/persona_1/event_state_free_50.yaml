method_name: event_state
method_type: agentic_memory
description: Event-State Hybrid conversational memory with evidence-preserving state compilation
model:
  provider: openai
  name: NIM/nvidia/nemotron-3.5-lightning-30b-a3b
  temperature: 0.0
  max_completion_tokens: 32000
  nim:
    enable_thinking: true
    reasoning_budget: 5000
memorize_model:
  provider: openai
  name: NIM/nvidia/nemotron-3.5-lightning-30b-a3b
  temperature: 0.0
  max_completion_tokens: 32000
  nim:
    enable_thinking: false
    reasoning_budget: 0
embedding:
  provider: local
  model: sentence-transformers/all-MiniLM-L6-v2
build_config:
  event_state_semantic_version: "2.5"
  enable_episodes: true
  enable_state_claims: true
  enable_state_compilation: true
  extraction_max_tokens: 3200
  extraction_temperature: 0.0
  max_claims_per_episode: 20
  update_temperature: 0.0
  update_max_tokens: 1600
  state_candidate_top_k: 5
  state_current_candidate_top_k: 3
  state_candidate_min_similarity: 0.45
  update_min_confidence: 0.55
  store_raw_episode_text: true
  enable_bitemporal_time: true
  preserve_turn_evidence: true
retrieval_config:
  max_context_tokens: 120000
  retrieve_claims: true
  retrieve_episodes: true
  claim_top_k: 30
  episode_top_k: 20
  candidate_count: 40
  fusion_mode: rrf
  rrf_k: 60.0
  claim_retrieval_weight: 1.0
  episode_retrieval_weight: 1.0
  ppr_enabled: false
  ppr_alpha: 0.85
  ppr_max_iterations: 20
  ppr_tolerance: 0.000001
  ppr_weight_supersedes: 1.2
  ppr_weight_refines: 1.0
  ppr_weight_conflict: 0.8
  ppr_weight_evidence: 0.7
  ppr_expand_hops: 2
  ppr_mix_weight: 0.35
  selector_mode: state_mmr
  evidence_count: 8
  mmr_lambda: 0.7
  state_relation_bonus: 0.05
  source_diversity_bonus: 0.02
  representation_balance_bonus: 0.02
  inject_source_evidence: true
  max_source_excerpts_per_claim: 2
dataset_overrides:
  persona_ids:
  - 1
  max_sessions_per_persona: 50
